[package]
name = "challenge"
version = "0.3.2"
edition = "2024"
authors = ["Luke Hsiao <luke@hsiao.dev>"]
description = "A brute-force challenge to introduce computer automation to kids."
repository = "https://github.com/lukehsiao/find-the-password"
homepage = "https://github.com/lukehsiao/find-the-password"
license = "BlueOak-1.0.0"
publish = false
rust-version = "1.98"

[dependencies]
dashmap = "6.2.1"
jiff = "0.2.37"
mimalloc = "0.1"
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
# Only what the app renders and serves; the default set adds assets, cookies,
# sessions, fonts, icons, and the client runtime, none of which it uses.
topcoat = { version = "0.10.0", default-features = false, features = ["compression", "serve"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hegeltest = { version = "0.48.1", features = ["jiff"] }
indicatif = "0.18.6"
mime = "0.3.17"
reqwest = "0.13.5"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
url = "2.5.8"

[[example]]
name = "passwords"
path = "examples/passwords/main.rs"

# One source of truth for lints, so `cargo clippy`, bacon, rust-analyzer, and CI
# all agree instead of each passing their own -W flags.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every component and page returns `Result<impl View>`; requiring #[must_use]
# on each is noise, not a bug filter.
must_use_candidate = "allow"

# Cross-crate inlining for the server binary; the request path spends its
# time in hyper and the topcoat router, not this crate, so LTO is where that
# shows up. Costs release-build time.
[profile.release]
lto = "thin"
codegen-units = 1
